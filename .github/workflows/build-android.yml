
name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          mkdir project
          unzip -q NOVA_PLAY_3.0.2_PHONE_BUILD.zip -d project

      - name: Build Android APK
        run: |
          cd project
          bash setup-android.sh
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

